[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zpb"
version = "0.1.0"
description = "Evidence-grade memory/CPU benchmark harness for the Zed editor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9",
]

[project.scripts]
zpb = "zpb.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["zpb*"]
